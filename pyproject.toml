[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "campaignforge"
version = "0.1.0"
description = "Multi-agent marketing campaign orchestration platform"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Sameer Alam" }]
keywords = [
    "marketing", "campaign", "ai-agents", "content-strategy",
    "seo", "social-media", "digital-marketing", "marketing-automation",
    "multi-agent", "orchestration", "llm", "copywriting"
]
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/campaignforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py311"
line-length = 100
